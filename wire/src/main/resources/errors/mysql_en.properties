# Dialect-native (English) message text for the MySQL wire protocol (mywire), keyed by Postgres
# SQLSTATE. See oracle_en.properties for the full explanation of how this file is used --
# DialectErrorMessages pairs this with SqlStateErrorMapper's numeric MySQL error code for the same
# SQLSTATE. Every message is real MySQL Server Error Reference wording, not invented.
#
# MySQL's own messages wrap identifiers in single quotes ('...') -- since a literal single quote
# is MessageFormat's own quoting character, every one must be doubled ('') or the placeholder
# right after it silently stops substituting (see ErrorCatalogTest's regression test for the same
# failure mode in the Phase 1 catalog).

42P01=Table ''{0}'' doesn''t exist
42703=Unknown column ''{0}''
23505=Duplicate entry for key ''{0}''
23502=Column ''{0}'' cannot be null
23503=Cannot add or update a child row: a foreign key constraint fails
42P07=Table ''{0}'' already exists
23514=Check constraint ''{1}'' is violated.
40P01=Deadlock found when trying to get lock; try restarting transaction
40001=Deadlock found when trying to get lock; try restarting transaction
22P02=Incorrect {0} value: ''{1}''
22003=Out of range value for column
22012=Division by 0
22001=Data too long for column
42501=Access denied for table ''{0}''
42883=FUNCTION {0} does not exist
55P03=Statement aborted because lock(s) could not be acquired immediately and NOWAIT is set.
57014=Query execution was interrupted, maximum statement execution time exceeded
