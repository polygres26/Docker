# PolyWire's own repo-authored error messages (English) -- NOT the messages that come back from
# the real Postgres JDBC driver, which are forwarded verbatim; see SqlStateErrorMapper for how
# those get a dialect-native error CODE independent of this file.
#
# Every key here is looked up by com.polygres.wire.core.ErrorCatalog. Values use
# java.text.MessageFormat placeholders ({0}, {1}, ...) rather than string concatenation at the
# call site -- this is what makes a future locale (errors/es.properties, etc.) a drop-in rather
# than a rewrite of every throw site. A literal apostrophe in a template that also has a
# placeholder must be doubled ('') per MessageFormat's own quoting rules, or everything after the
# stray quote silently stops being treated as literal text; templates with no placeholder don't
# go through MessageFormat at all, so a plain apostrophe there is safe as written.

# -- AccessControlStage --
ERR_ACCESS_MISSING_ATTRIBUTE=statement rejected: missing required access attribute "{0}" for a row-restricted table
ERR_ACCESS_COLUMN_NOT_ENTITLED=statement rejected: caller is not entitled to column "{0}"

# -- DbLinkStage --
ERR_DBLINK_NOT_FOUND=ORA-02019: database link not found: {0}

# -- FirewallStage --
ERR_FIREWALL_STACKED_QUERY=statement rejected by firewall: stacked query detected
ERR_FIREWALL_RULE_MATCH=statement rejected by firewall rule{0}

# -- LazyPooledConnection --
ERR_UNSUPPORTED_SCHEMA_USERNAME=unsupported username as schema name: {0}

# -- QosControlStage --
ERR_QOS_RATE_LIMIT=rate limit exceeded for workload class "{0}"
ERR_QOS_POOL_SATURATED=backend "{0}" pool saturated ({1} already waiting)

# -- RollupStage / RollupRefreshJob --
ERR_ROLLUP_PLAN_FAILED=rollup: failed to plan "{0}": {1}
ERR_ROLLUP_UNKNOWN_BACKEND=rollup "{0}" references backend "{1}", which isn''t a configured POLYWIRE_BACKENDS entry

# -- RoutingBackendExecutor --
ERR_ROUTER_UNKNOWN_BACKEND=router assigned unknown backend "{0}"
ERR_SCATTER_ONLY_SELECT=scatter-gather only supports SELECT, got: {0}
ERR_SCATTER_NOT_CONFIGURED=router assigned scatter-gather but POLYWIRE_SHARD_BACKENDS is not configured
ERR_SHARD_UNKNOWN_BACKEND=shard group references unknown backend "{0}"
ERR_SHARD_JOIN_PLAN_FAILED=cross-shard join: failed to plan "{0}": {1}

# -- ScatterGatherAggregateMerge --
ERR_SCATTER_UNSUPPORTED_AGGREGATE=scatter-gather: "{0}(...)" is not a supported aggregate for cross-shard merging (only COUNT/SUM/AVG/MIN/MAX) -- run this against a single shard instead of a shard group
ERR_SCATTER_DISTINCT_UNSUPPORTED=scatter-gather: {0}(DISTINCT ...) can''t be correctly merged across shards (a distinct count/aggregate needs the full set of values, not a per-shard partial) -- run this against a single shard instead of a shard group

# -- ScatterGatherOrderLimit --
ERR_SCATTER_ORDERBY_POSITION_RANGE=scatter-gather: ORDER BY position {0} is out of range for a {1}-column result
ERR_SCATTER_ORDERBY_NO_MATCH=scatter-gather: ORDER BY "{0}" doesn''t match any result column by name or position -- cross-shard ORDER BY can only be applied to an actual selected column/alias, not an arbitrary expression; run this against a single shard instead of a shard group if you need to sort by an expression

# -- PgFunctionIntrospector (mcp) --
ERR_FUNCTION_NOT_FOUND=no such function/procedure: {0}.{1}

# -- NativeOracleExecutor (orawire) --
ERR_NATIVE_NO_OPEN_CURSOR=fetchMore() with no open native cursor
ERR_NATIVE_CAPTURE_INTERRUPTED=interrupted waiting for native capture session
ERR_NATIVE_CONNECT_FAILED=native connect failed

# -- XaBackendFactory --
ERR_XA_NOT_POSTGRES_URL=XA unsupported for backend "{0}": not a Postgres JDBC URL ({1}) — PolyWire''s XA coordinator is Postgres-only
ERR_XA_NOT_POSTGRES_URL_DIRECT=XA unsupported: not a Postgres JDBC URL ({0}) — PolyWire''s XA coordinator is Postgres-only
