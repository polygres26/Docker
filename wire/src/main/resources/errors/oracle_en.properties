# Dialect-native (English) message text for the Oracle wire protocol (orawire), keyed by the
# Postgres SQLSTATE that triggered it -- paired with SqlStateErrorMapper's numeric ORA-xxxxx code
# for that same SQLSTATE, so a real Oracle client sees both the correct error NUMBER and Oracle's
# own actual wording, not Postgres's. Every message here is the real, verified Oracle error text
# (see SqlStateErrorMapper's inline comments for the verification notes on each code) -- not
# invented. A SQLSTATE with no entry here falls back to forwarding Postgres's own message text
# unchanged (see DialectErrorMessages.render).
#
# {0}/{1} placeholders are filled from DialectErrorMessages.EXTRACTORS, which pulls the real
# identifier (table/column/constraint name) out of Postgres's own message text via regex --
# Oracle's official wording for several of these codes has NO placeholder at all (e.g. ORA-00942
# never names the missing table), so most entries below are deliberately fixed text, matching
# Oracle's real behavior rather than adding an interpolation Oracle itself doesn't have.

42P01=ORA-00942: table or view does not exist
42703=ORA-00904: "{0}": invalid identifier
23505=ORA-00001: unique constraint ({0}) violated
23502=ORA-01400: cannot insert NULL into ("{1}"."{0}")
23503=ORA-02291: integrity constraint ({1}) violated - parent key not found
42P07=ORA-00955: name is already used by an existing object
23514=ORA-02290: check constraint ({1}) violated
40P01=ORA-00060: deadlock detected while waiting for resource
40001=ORA-08177: can''t serialize access for this transaction
22P02=ORA-01722: invalid number
22003=ORA-01438: value larger than specified precision allowed for this column
22012=ORA-01476: divisor is equal to zero
22001=ORA-12899: value too large for column
42501=ORA-01031: insufficient privileges
42883=ORA-00904: "{0}": invalid identifier
55P03=ORA-00054: resource busy and acquire with NOWAIT specified or timeout expired
57014=ORA-01013: user requested cancel of current operation
