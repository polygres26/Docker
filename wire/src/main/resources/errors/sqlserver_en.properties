# Dialect-native (English) message text for the SQL Server wire protocol (mssqlwire), keyed by
# Postgres SQLSTATE. See oracle_en.properties for the full explanation. Every message is real SQL
# Server sys.messages wording, not invented -- except 57014 (query_canceled), which has no real
# sys.messages entry at all (see SqlStateErrorMapper's comment on that SQLSTATE); the text below is
# a plain, honest description rather than a fabricated official-sounding message.
#
# SQL Server itself mixes single-quoted (''...'') and double-quoted ("...") identifiers depending
# on the specific message -- reproduced exactly as SQL Server actually formats each one, with every
# literal single quote doubled per MessageFormat's own quoting rules.

42P01=Invalid object name ''{0}''.
42703=Invalid column name ''{0}''.
23505=Violation of UNIQUE KEY constraint ''{0}''. Cannot insert duplicate key.
23502=Cannot insert the value NULL into column ''{0}'', table ''{1}''; column does not allow nulls.
23503=The INSERT statement conflicted with the FOREIGN KEY constraint "{1}". The conflict occurred in table "{0}".
42P07=There is already an object named ''{0}'' in the database.
23514=The INSERT statement conflicted with the CHECK constraint "{1}". The conflict occurred in database table "{0}".
40P01=Transaction was deadlocked on lock resources with another process and has been chosen as the deadlock victim. Rerun the transaction.
40001=Transaction was deadlocked on lock resources with another process and has been chosen as the deadlock victim. Rerun the transaction.
22P02=Conversion failed when converting the varchar value ''{1}'' to data type {0}.
22003=Arithmetic overflow error converting {0} to data type.
22012=Divide by zero error encountered.
22001=String or binary data would be truncated.
42501=The SELECT permission was denied on the object ''{0}''.
42883=''{0}'' is not a recognized built-in function name.
55P03=Lock request time out period exceeded.
57014=Query was canceled.
42702=Ambiguous column name ''{0}''.
53300=Too many connections.

# Delete-side of foreign_key_violation (23503) -- SQL Server's numeric code (547) is the SAME for
# both directions (see SqlStateErrorMapper.isForeignKeyDeleteSide's javadoc), but its real message
# wording still differs: "DELETE statement" + "REFERENCE constraint" here vs. "INSERT statement" +
# "FOREIGN KEY constraint" on the insert-side entry above.
23503_DELETE=The DELETE statement conflicted with the REFERENCE constraint "{1}". The conflict occurred in table "{2}".
