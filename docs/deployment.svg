<svg viewBox="0 0 1540 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="PolyWire multi-AZ cloud deployment: client applications behind a network load balancer, PolyWire instances spread across three availability zones each holding a primary or backup PolyCache copy, a Postgres data plane (one primary shard and its secondaries/replicas, one per zone) fronted by each zone's own PolyWire instances, and a separate config-primary Postgres (polywire_config / firewall rules) with a standby for automatic failover, pushing config changes to every zone via LISTEN/NOTIFY.">
  <defs>
    <marker id="dArrowSolid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a3fd6"/>
    </marker>
    <marker id="dArrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a2c"/>
    </marker>
    <marker id="dArrowPurpleLight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b6fe8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1540" height="1000" fill="#ffffff"/>

  <!-- ===================== HEADER ===================== -->
  <text x="770" y="44" font-size="32" font-weight="800" fill="#1c1c2e" text-anchor="middle">PolyWire <tspan fill="#5a3fd6">Cloud Deployment</tspan></text>

  <!-- ===================== CLIENT APPLICATIONS ===================== -->
  <rect x="460" y="76" width="620" height="56" rx="10" fill="#f4f0fc" stroke="#c9bdf2" stroke-width="1.5"/>
  <rect x="480" y="90" width="28" height="28" rx="6" fill="#5a3fd6"/>
  <rect x="486" y="96" width="7" height="7" fill="#fff"/>
  <rect x="497" y="96" width="7" height="7" fill="#fff"/>
  <rect x="486" y="107" width="7" height="7" fill="#fff"/>
  <rect x="497" y="107" width="7" height="7" fill="#fff"/>
  <text x="770" y="110" font-size="17" font-weight="700" fill="#1c1c2e" text-anchor="middle">Client applications — any protocol, any zone</text>

  <line x1="770" y1="132" x2="770" y2="156" stroke="#5a3fd6" stroke-width="2.5" marker-end="url(#dArrowSolid)"/>

  <!-- ===================== NLB ===================== -->
  <rect x="440" y="160" width="660" height="86" rx="10" fill="#f4f0fc" stroke="#c9bdf2" stroke-width="1.5"/>
  <g transform="translate(560,178)">
    <circle cx="12" cy="6" r="6" fill="#5a3fd6"/>
    <line x1="12" y1="12" x2="12" y2="24" stroke="#5a3fd6" stroke-width="2.5"/>
    <line x1="0" y1="24" x2="24" y2="24" stroke="#5a3fd6" stroke-width="2.5"/>
    <line x1="0" y1="24" x2="0" y2="34" stroke="#5a3fd6" stroke-width="2.5"/>
    <line x1="24" y1="24" x2="24" y2="34" stroke="#5a3fd6" stroke-width="2.5"/>
    <circle cx="0" cy="40" r="6" fill="#5a3fd6"/>
    <circle cx="24" cy="40" r="6" fill="#5a3fd6"/>
  </g>
  <text x="770" y="196" font-size="19" font-weight="800" fill="#1c1c2e" text-anchor="middle">Network Load Balancer</text>
  <text x="770" y="217" font-size="13.5" fill="#4a4964" text-anchor="middle">AWS NLB · GCP TCP LB · Azure Standard LB</text>
  <text x="770" y="235" font-size="13.5" fill="#4a4964" text-anchor="middle">Cross-zone balancing, TCP health checks</text>

  <!-- fan-out to three zones -->
  <path d="M770,246 L770,260 L250,260 L250,272" stroke="#5a3fd6" stroke-width="2.5" fill="none" marker-end="url(#dArrowSolid)"/>
  <path d="M770,246 L770,272" stroke="#5a3fd6" stroke-width="2.5" fill="none" marker-end="url(#dArrowSolid)"/>
  <path d="M770,246 L770,260 L1290,260 L1290,272" stroke="#5a3fd6" stroke-width="2.5" fill="none" marker-end="url(#dArrowSolid)"/>

  <!-- ===================== ZONE TEMPLATE (A, B, C) ===================== -->
  <!-- Zone A -->
  <g>
    <rect x="34" y="284" width="440" height="300" rx="12" fill="#fafcfb" stroke="#8fd0c0" stroke-width="1.5" stroke-dasharray="5,4"/>
    <circle cx="70" cy="312" r="8" fill="#0f6660"/>
    <text x="70" y="317" font-size="9" fill="#fff" text-anchor="middle">📍</text>
    <text x="90" y="317" font-size="15" font-weight="800" fill="#0f6660">Availability zone A</text>

    <rect x="52" y="336" width="196" height="112" rx="10" fill="#ffffff" stroke="#c9bdf2" stroke-width="1.5"/>
    <rect x="70" y="352" width="34" height="34" rx="4" fill="#eeeafc" stroke="#5a3fd6" stroke-width="1.5"/>
    <text x="87" y="374" font-size="14" text-anchor="middle" fill="#5a3fd6">⬡</text>
    <text x="114" y="364" font-size="13.5" font-weight="800" fill="#1c1c2e">PolyWire</text>
    <text x="114" y="381" font-size="12" fill="#4a4964">instance 1a</text>
    <text x="114" y="396" font-size="12" fill="#4a4964">holds primary</text>
    <text x="114" y="411" font-size="12" fill="#4a4964">copies</text>

    <rect x="258" y="336" width="196" height="112" rx="10" fill="#ffffff" stroke="#c9bdf2" stroke-width="1.5"/>
    <rect x="276" y="352" width="34" height="34" rx="4" fill="#eeeafc" stroke="#5a3fd6" stroke-width="1.5"/>
    <text x="293" y="374" font-size="14" text-anchor="middle" fill="#5a3fd6">⬡</text>
    <text x="320" y="364" font-size="13.5" font-weight="800" fill="#1c1c2e">PolyWire</text>
    <text x="320" y="381" font-size="12" fill="#4a4964">instance 1b</text>
    <text x="320" y="396" font-size="12" fill="#4a4964">holds backup</text>
    <text x="320" y="411" font-size="12" fill="#4a4964">copies</text>

    <rect x="52" y="460" width="402" height="30" rx="7" fill="#eaf6f0"/>
    <text x="253" y="480" font-size="12.5" font-weight="600" fill="#0f6660" text-anchor="middle">each entry:  1 primary + N backup copies</text>

    <rect x="52" y="502" width="402" height="60" rx="10" fill="#ffffff" stroke="#c9bdf2" stroke-width="1.5"/>
    <path d="M78,522 a12,5 0 1,0 0.01,0 M66,522 v20 a12,5 0 0,0 24,0 v-20" fill="#eeeafc" stroke="#5a3fd6" stroke-width="1.75"/>
    <text x="104" y="530" font-size="13.5" font-weight="800" fill="#1c1c2e">PostgresDB primary</text>
    <text x="104" y="548" font-size="12" fill="#4a4964">(shard 1)</text>
  </g>

  <!-- Zone B -->
  <g>
    <rect x="546" y="284" width="440" height="300" rx="12" fill="#fafcfb" stroke="#8fd0c0" stroke-width="1.5" stroke-dasharray="5,4"/>
    <circle cx="582" cy="312" r="8" fill="#0f6660"/>
    <text x="582" y="317" font-size="9" fill="#fff" text-anchor="middle">📍</text>
    <text x="602" y="317" font-size="15" font-weight="800" fill="#0f6660">Availability zone B</text>

    <rect x="564" y="336" width="196" height="112" rx="10" fill="#ffffff" stroke="#c9bdf2" stroke-width="1.5"/>
    <rect x="582" y="352" width="34" height="34" rx="4" fill="#eeeafc" stroke="#5a3fd6" stroke-width="1.5"/>
    <text x="599" y="374" font-size="14" text-anchor="middle" fill="#5a3fd6">⬡</text>
    <text x="626" y="364" font-size="13.5" font-weight="800" fill="#1c1c2e">PolyWire</text>
    <text x="626" y="381" font-size="12" fill="#4a4964">instance 2a</text>
    <text x="626" y="396" font-size="12" fill="#4a4964">holds primary</text>
    <text x="626" y="411" font-size="12" fill="#4a4964">copies</text>

    <rect x="770" y="336" width="196" height="112" rx="10" fill="#ffffff" stroke="#c9bdf2" stroke-width="1.5"/>
    <rect x="788" y="352" width="34" height="34" rx="4" fill="#eeeafc" stroke="#5a3fd6" stroke-width="1.5"/>
    <text x="805" y="374" font-size="14" text-anchor="middle" fill="#5a3fd6">⬡</text>
    <text x="832" y="364" font-size="13.5" font-weight="800" fill="#1c1c2e">PolyWire</text>
    <text x="832" y="381" font-size="12" fill="#4a4964">instance 2b</text>
    <text x="832" y="396" font-size="12" fill="#4a4964">holds backup</text>
    <text x="832" y="411" font-size="12" fill="#4a4964">copies</text>

    <rect x="564" y="460" width="402" height="30" rx="7" fill="#eaf6f0"/>
    <text x="765" y="480" font-size="12.5" font-weight="600" fill="#0f6660" text-anchor="middle">each entry:  1 primary + N backup copies</text>

    <rect x="564" y="502" width="402" height="60" rx="10" fill="#ffffff" stroke="#c9bdf2" stroke-width="1.5"/>
    <path d="M590,522 a12,5 0 1,0 0.01,0 M578,522 v20 a12,5 0 0,0 24,0 v-20" fill="#eeeafc" stroke="#5a3fd6" stroke-width="1.75"/>
    <text x="616" y="530" font-size="13.5" font-weight="800" fill="#1c1c2e">PostgresDB secondary (replica)</text>
    <text x="616" y="548" font-size="12" fill="#4a4964">(shard 1 read replica)</text>
  </g>

  <!-- Zone C -->
  <g>
    <rect x="1058" y="284" width="440" height="300" rx="12" fill="#fafcfb" stroke="#8fd0c0" stroke-width="1.5" stroke-dasharray="5,4"/>
    <circle cx="1094" cy="312" r="8" fill="#0f6660"/>
    <text x="1094" y="317" font-size="9" fill="#fff" text-anchor="middle">📍</text>
    <text x="1114" y="317" font-size="15" font-weight="800" fill="#0f6660">Availability zone C</text>

    <rect x="1076" y="336" width="196" height="112" rx="10" fill="#ffffff" stroke="#c9bdf2" stroke-width="1.5"/>
    <rect x="1094" y="352" width="34" height="34" rx="4" fill="#eeeafc" stroke="#5a3fd6" stroke-width="1.5"/>
    <text x="1111" y="374" font-size="14" text-anchor="middle" fill="#5a3fd6">⬡</text>
    <text x="1138" y="364" font-size="13.5" font-weight="800" fill="#1c1c2e">PolyWire</text>
    <text x="1138" y="381" font-size="12" fill="#4a4964">instance 3a</text>
    <text x="1138" y="396" font-size="12" fill="#4a4964">holds primary</text>
    <text x="1138" y="411" font-size="12" fill="#4a4964">copies</text>

    <rect x="1282" y="336" width="196" height="112" rx="10" fill="#ffffff" stroke="#c9bdf2" stroke-width="1.5"/>
    <rect x="1300" y="352" width="34" height="34" rx="4" fill="#eeeafc" stroke="#5a3fd6" stroke-width="1.5"/>
    <text x="1317" y="374" font-size="14" text-anchor="middle" fill="#5a3fd6">⬡</text>
    <text x="1344" y="364" font-size="13.5" font-weight="800" fill="#1c1c2e">PolyWire</text>
    <text x="1344" y="381" font-size="12" fill="#4a4964">instance 3b</text>
    <text x="1344" y="396" font-size="12" fill="#4a4964">holds backup</text>
    <text x="1344" y="411" font-size="12" fill="#4a4964">copies</text>

    <rect x="1076" y="460" width="402" height="30" rx="7" fill="#eaf6f0"/>
    <text x="1277" y="480" font-size="12.5" font-weight="600" fill="#0f6660" text-anchor="middle">each entry:  1 primary + N backup copies</text>

    <rect x="1076" y="502" width="402" height="60" rx="10" fill="#ffffff" stroke="#c9bdf2" stroke-width="1.5"/>
    <path d="M1102,522 a12,5 0 1,0 0.01,0 M1090,522 v20 a12,5 0 0,0 24,0 v-20" fill="#eeeafc" stroke="#5a3fd6" stroke-width="1.75"/>
    <text x="1128" y="530" font-size="13.5" font-weight="800" fill="#1c1c2e">PostgresDB secondary</text>
    <text x="1128" y="548" font-size="12" fill="#4a4964">(shard 2 / N)</text>
  </g>

  <!-- ===================== BACKUP-REPLICATION RING (dotted, arrowed) ===================== -->
  <g stroke="#8b6fe8" stroke-width="1.75" stroke-dasharray="4,4" fill="none">
    <path d="M254,586 C254,604 320,616 460,616" marker-end="url(#dArrowPurpleLight)"/>
    <path d="M766,586 C766,606 700,616 620,616" marker-end="url(#dArrowPurpleLight)"/>
    <path d="M1278,586 C1278,604 1100,616 1080,616" marker-end="url(#dArrowPurpleLight)"/>
  </g>
  <text x="770" y="608" font-size="12.5" fill="#4a4964" text-anchor="middle">backup copies replicate to the next zone</text>
  <text x="770" y="624" font-size="12.5" fill="#4a4964" text-anchor="middle">(dotted, arrowed) — C wraps around to A</text>
  <path d="M258,586 C160,608 90,608 60,586" stroke="#8b6fe8" stroke-width="1.75" stroke-dasharray="4,4" fill="none" marker-end="url(#dArrowPurpleLight)"/>

  <!-- ===================== CONFIG-PRIMARY POSTGRES + STANDBY ===================== -->
  <g stroke="#e08a2c" stroke-width="1.75" stroke-dasharray="4,3" fill="none">
    <path d="M240,586 C240,650 400,668 590,690"/>
    <path d="M766,586 C766,640 720,668 700,690" marker-end="url(#dArrowOrange)"/>
    <path d="M1290,586 C1290,650 1120,668 950,690" marker-end="url(#dArrowOrange)"/>
  </g>
  <path d="M240,586 C240,650 400,668 590,690" stroke="#e08a2c" stroke-width="1.75" stroke-dasharray="4,3" fill="none" marker-end="url(#dArrowOrange)"/>

  <g>
    <path d="M600,660 h140 a10,10 0 0 1 10,10 v70 a75,14 0 0 1 -160,0 v-70 a10,10 0 0 1 10,-10 z" fill="#f4f0fc" stroke="#5a3fd6" stroke-width="1.75"/>
    <ellipse cx="670" cy="670" rx="80" ry="14" fill="#f4f0fc" stroke="#5a3fd6" stroke-width="1.75"/>
    <path d="M660,650 l10,-10 l10,10 v18 h-20 z" fill="#5a3fd6"/>
    <text x="670" y="704" font-size="13" font-weight="800" fill="#1c1c2e" text-anchor="middle">Config-primary Postgres</text>
    <text x="670" y="722" font-size="12" fill="#4a4964" text-anchor="middle">polywire_config /</text>
    <text x="670" y="738" font-size="12" fill="#4a4964" text-anchor="middle">firewall rules</text>
  </g>

  <g>
    <ellipse cx="890" cy="694" rx="100" ry="52" fill="#f4f0fc" stroke="#5a3fd6" stroke-width="1.75" stroke-dasharray="5,4"/>
    <text x="890" y="690" font-size="13" font-weight="800" fill="#1c1c2e" text-anchor="middle">Standby — different zone</text>
    <text x="890" y="710" font-size="12" fill="#4a4964" text-anchor="middle">automatic failover</text>
  </g>
  <line x1="770" y1="694" x2="790" y2="694" stroke="#8b6fe8" stroke-width="1.75" stroke-dasharray="4,3"/>

  <!-- LISTEN/NOTIFY bell -->
  <g>
    <rect x="644" y="770" width="52" height="52" rx="10" fill="#fdf1e2" stroke="#e08a2c" stroke-width="1.75"/>
    <text x="670" y="804" font-size="22" text-anchor="middle" fill="#e08a2c">🔔</text>
  </g>
  <line x1="670" y1="746" x2="670" y2="770" stroke="#e08a2c" stroke-width="1.75" stroke-dasharray="4,3" marker-end="url(#dArrowOrange)"/>
  <text x="712" y="792" font-size="15" font-weight="700" fill="#1c1c2e">LISTEN/NOTIFY,</text>
  <text x="712" y="812" font-size="15" font-weight="700" fill="#1c1c2e">all zones</text>

  <!-- ===================== FOOTNOTE + LEGEND ===================== -->
  <g>
    <rect x="34" y="858" width="880" height="100" rx="10" fill="#f4f0fc" stroke="#c9bdf2" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="66" cy="890" r="16" fill="#5a3fd6"/>
    <text x="66" y="896" font-size="14" text-anchor="middle" fill="#fff">i</text>
    <text x="92" y="884" font-size="13" font-weight="700" fill="#1c1c2e">Data-plane Postgres — one logical shard set, replicated/shared across zones by your existing Postgres HA</text>
    <text x="92" y="902" font-size="13" fill="#33324a">(RDS Multi-AZ, Cloud SQL HA, Azure Flexible Server zone-redundant HA, or self-managed streaming replication).</text>
    <text x="92" y="920" font-size="13" fill="#33324a">PolyWire's RouterStage sends each request to the shard/replica that owns it — it does not replicate data itself.</text>
  </g>

  <g>
    <rect x="962" y="858" width="410" height="120" rx="10" fill="#ffffff" stroke="#c9c4e0" stroke-width="1.5"/>
    <text x="984" y="884" font-size="15" font-weight="800" fill="#1c1c2e">Legend</text>
    <line x1="984" y1="902" x2="1030" y2="902" stroke="#5a3fd6" stroke-width="2.5"/>
    <text x="1042" y="907" font-size="13" fill="#33324a">request path</text>
    <line x1="984" y1="924" x2="1030" y2="924" stroke="#e08a2c" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="1042" y="929" font-size="13" fill="#33324a">LISTEN/NOTIFY config push</text>
    <line x1="984" y1="946" x2="1030" y2="946" stroke="#8b6fe8" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="1042" y="951" font-size="13" fill="#33324a">backup-copy replication</text>
  </g>
</svg>
