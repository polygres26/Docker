version: "3.8"

# Run from the repo root: docker compose -f docker/polyadvisor/docker-compose.yml up --build
# Two containers: the Java backend (AdvisorHttpServer, port 8090, internal only) and nginx serving
# the built SPA + proxying /api to it (port 80, published) -- see nginx.conf's own comment for why
# this split exists instead of one process serving both.

services:
  backend:
    build:
      context: ../..
      dockerfile: docker/polyadvisor/Dockerfile
    environment:
      POLYGRES_ADVISOR_PORT: "8090"
    volumes:
      # Embedded HSQLDB store (saved connections, LLM provider config, uploaded performance
      # reports) -- see ConnectionStore/LlmSettingsStore/ReportStore's javadoc. Persists across
      # container restarts/rebuilds; delete the volume to start fresh.
      - polyadvisor-data:/data
    expose:
      - "8090"

  frontend:
    build:
      context: ../..
      dockerfile: docker/polyadvisor/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  polyadvisor-data:
