# Spins up a real, disposable Postgres backend plus Warp itself, using the published images
# (no source checkout, no `mvn`/`npm` build) -- everything a wire-protocol client needs to talk
# to is on localhost once `docker compose up` reports both services healthy.
#
# Every wire protocol frontend translates to the *same* Postgres underneath, so one backend
# container is all this needs -- there's no real Oracle/SQL Server/MongoDB/DynamoDB behind any
# of these ports, only Postgres. That's the whole point of Warp.
#
# Usage: see ../../tests/README.md (or the sibling python/java dirs directly).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  warp:
    image: ghcr.io/polygres26/warp:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WARP_HOST: postgres
      WARP_PORT: "5432"
      WARP_DATABASE: postgres
      WARP_USER: postgres
      WARP_PASSWORD: postgres
      # WARP_AUTH_* is the *frontend* login credential every wire-protocol client
      # authenticates with -- separate from WARP_* above (how Warp itself reaches the
      # real Postgres). Defaults to orapg/orapg if unset; set to postgres/postgres here so every
      # test below can just connect as user=postgres password=postgres, same as the backend.
      WARP_AUTH_USER: postgres
      WARP_AUTH_PASSWORD: postgres
      WARP_ADMIN_TOKEN: test-admin-token
      # Warp's out-of-the-box QoS default is intentionally conservative (5 requests/sec,
      # burst 5) -- sensible for a real deployment, too tight for this suite's ~15 tests firing
      # in well under a second. Raised here for the test environment only.
      WARP_QOS_RATE_PER_SEC: "200"
      WARP_QOS_BURST: "400"
    ports:
      - "15432:15432" # pgwire
      - "13306:13306" # mywire
      - "11521:11521" # orawire
      - "14333:14333" # mssqlwire
      - "27017:27017" # mongowire
      - "18000:18000" # dynamowire
      - "9324:9324"   # sqswire
      - "9200:9200"   # oswire (was missing from this file even though conftest.py already
                      # referenced OSWIRE_PORT -- added while adding influxwire below)
      - "8086:8086"   # influxwire
      - "7687:7687"   # boltwire
      - "19090:19090" # admin app + /metrics, /config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:19090/metrics >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
