version: "3.8"

# Run from the repo root: docker compose -f docker/warp/docker-compose.yml up --build
# Brings up a real Postgres backend plus Warp itself, wired together -- enough to point psql/
# any of Warp's other client protocols at localhost and get a real, working gateway.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - warp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  warp:
    build:
      context: ../..
      dockerfile: docker/warp/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The one real backend every control-plane table (warp_config, warp_firewall_rules,
      # warp_translation_cache, warp_failed_statements) and, by default, all query traffic
      # target -- see PgConnections'/BackendTarget's javadoc for the "config primary vs. sharded
      # data plane" split if WARP_BACKENDS is ever added here.
      WARP_HOST: postgres
      WARP_PORT: "5432"
      WARP_DATABASE: postgres
      WARP_USER: postgres
      WARP_PASSWORD: postgres
      # Shared dev credential for every wire-protocol frontend's default (non-postgres_roles) auth
      # -- see com.sayonora.warp.auth.CredentialStore's javadoc. Change for anything beyond local
      # dev/test; consider WARP_AUTH_MODE=postgres_roles for real per-role Postgres auth instead
      # (see com.sayonora.warp.auth.PgRoleAuthCache's javadoc).
      WARP_AUTH_USER: postgres
      WARP_AUTH_PASSWORD: postgres
    ports:
      - "15432:15432" # pgwire (Postgres wire protocol)
      - "13306:13306" # mywire (MySQL wire protocol)
      - "11521:11521" # orawire (Oracle TNS/TTC)
      - "14333:14333" # mssqlwire (SQL Server TDS)
      - "27017:27017" # mongowire (MongoDB wire protocol)
      - "7070:7070"   # gRPC (Warp's own native driver protocol)
      - "18000:18000" # dynamowire (DynamoDB HTTP/JSON)
      - "9324:9324"   # sqswire (Amazon SQS HTTP/JSON)
      - "9200:9200"   # oswire (OpenSearch HTTP/JSON)
      - "8086:8086"   # influxwire (InfluxDB HTTP/JSON)
      - "16379:16379" # rediswire (RESP2/RESP3), enable with WARP_REDISWIRE_ENABLED
      - "7687:7687"   # boltwire (Neo4j Bolt), enable with WARP_BOLTWIRE_ENABLED
      - "18020:18020" # s3wire (Amazon S3), enable with WARP_S3WIRE_ENABLED
      - "4443:4443"   # gcswire (Google Cloud Storage), enable with WARP_GCSWIRE_ENABLED
      - "4566:4566"   # awswire (SNS, Kinesis, Secrets Manager, SSM, KMS, STS), enable with WARP_AWSWIRE_ENABLED
      - "8085:8085"   # pubsubwire (Google Pub/Sub gRPC), enable with WARP_PUBSUBWIRE_ENABLED
      - "8088:8088"   # bigtablewire (Google Bigtable gRPC), enable with WARP_BIGTABLEWIRE_ENABLED
      - "8080:8080"   # firestorewire (Google Firestore gRPC + REST), enable with WARP_FIRESTOREWIRE_ENABLED
      - "8081:8081"   # datastorewire (Google Datastore gRPC + REST), enable with WARP_DATASTOREWIRE_ENABLED
      - "19042:19042" # cqlwire (Apache Cassandra CQL native protocol), enable with WARP_CQLWIRE_ENABLED
      - "8182:8182"   # gremlinwire (Apache TinkerPop Gremlin Server: WebSocket + HTTP; Cosmos DB Gremlin API), enable with WARP_GREMLINWIRE_ENABLED
      - "19092:19092" # kafkawire (Apache Kafka wire protocol), enable with WARP_KAFKAWIRE_ENABLED; set WARP_KAFKAWIRE_ADVERTISED_HOST to the name clients use
      - "18081:18081" # cosmoswire (Azure Cosmos DB NoSQL REST), enable with WARP_COSMOSWIRE_ENABLED
      - "5672:5672"   # amqpwire (RabbitMQ clients, AMQP 0-9-1 and 1.0), enable with WARP_AMQPWIRE_ENABLED
      - "18010:18010" # MCP (Model Context Protocol)
      - "19090:19090" # admin app (browser UI) + /metrics, /config (admin HTTP API)

volumes:
  warp-postgres-data:
