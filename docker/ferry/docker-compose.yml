version: "3.8"

# Run from the repo root: docker compose -f docker/ferry/docker-compose.yml up --build
# One container: DmsHttpServer (embedded Jetty) serves both the JSON API and the built SPA
# directly (SpaResourceHandler) -- no nginx needed. See Dockerfile's own comment if you'd rather
# front it with a separate static tier instead.

services:
  advisor:
    build:
      context: ../..
      dockerfile: docker/ferry/Dockerfile
    environment:
      SAYONORA_DMS_PORT: "8090"
    volumes:
      # Embedded HSQLDB store (saved connections, LLM provider config, uploaded performance
      # reports) -- see ConnectionStore/LlmSettingsStore/ReportStore's javadoc. Persists across
      # container restarts/rebuilds; delete the volume to start fresh.
      - polyadvisor-data:/data
    ports:
      - "8090:8090"

volumes:
  polyadvisor-data:
