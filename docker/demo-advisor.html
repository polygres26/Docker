  --bg: #eef1f6; --panel: #ffffff; --text: #172033; --muted: #5c6b85; --border: #dde3ef;
  --accent: #2f5fb8; --accent-strong: #24478f; --accent-soft: #e6edfa;
  --hard: #c0392b; --hard-soft: #fbeae8; --medium: #b9770e; --medium-soft: #fbf1e0;
  --easy: var(--accent); --easy-soft: var(--accent-soft);
  --shadow-sm: 0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
  --shadow-md: 0 8px 24px rgba(15,23,42,.10), 0 2px 6px rgba(15,23,42,.06);
  --rail-bg: #101a2e; --rail-ink: #dce6f7; --rail-ink-dim: #7c8bab;
  --rail-hover: #17253f; --rail-active: #1d2f4f; --rail-accent: #5b8ff0; --rail-rule: #1c2a45;
  --demo-bg: #e4e9f3; --demo-ink: #445070;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1220; --panel: #141b2e; --text: #e6ecf9; --muted: #93a1c2; --border: #26314c;
    --accent: #6c96e6; --accent-strong: #8fb0ee; --accent-soft: #1a2740;
    --hard: #e58a7e; --hard-soft: #3a201e; --medium: #dba85f; --medium-soft: #332508;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 8px 24px rgba(0,0,0,.35);
    --demo-bg: #0a0e18; --demo-ink: #8b98bd;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1220; --panel: #141b2e; --text: #e6ecf9; --muted: #93a1c2; --border: #26314c;
  --accent: #6c96e6; --accent-strong: #8fb0ee; --accent-soft: #1a2740;
  --hard: #e58a7e; --hard-soft: #3a201e; --medium: #dba85f; --medium-soft: #332508;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 8px 24px rgba(0,0,0,.35);
  --demo-bg: #0a0e18; --demo-ink: #8b98bd;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--demo-bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; min-height: 100vh;
}
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
button { font: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
::selection { background: var(--accent); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Demo chrome (not part of either real app -- the picker + status strip) ---------- */

.demoBar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 22px; border-bottom: 1px solid var(--border); background: var(--panel);
  flex: none;
}
.demoBar .tag {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--demo-ink); background: var(--bg); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 10px;
}
.demoBar .hint { font-size: 12.5px; color: var(--muted); margin-left: auto; }
.demoBar .hint kbd {
  font: 11px ui-monospace, monospace; background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px;
}

.stage { flex: 1; display: flex; min-height: 0; padding: 20px; }
.frame {
  flex: 1; display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
  overflow: hidden; box-shadow: var(--shadow-md); min-height: 0;
}

/* ---------- Replica of Layout.tsx / Layout.module.css ---------- */

.rail { width: 220px; flex: none; display: flex; flex-direction: column; padding: 16px 12px; background: var(--rail-bg); overflow-y: auto; }
.railBrand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.railMark { width: 32px; height: 32px; border-radius: 9px; flex: none; background-image: var(--logo-url); background-size: cover; background-position: center; }
.railBrandTitle { color: var(--rail-ink); font-weight: 700; font-size: 13.5px; display: block; }
.railBrandSub { color: var(--rail-ink-dim); font-size: 10.5px; display: block; }
.railSection { margin-bottom: 4px; }
.railSectionLabel { color: var(--rail-ink-dim); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; padding: 14px 10px 6px; }
.railGroup { display: flex; flex-direction: column; gap: 2px; }
.railSpacer { flex: 1; }
.railItem {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px;
  color: var(--rail-ink-dim); font-size: 13.5px; white-space: nowrap; border: none; background: none;
  width: 100%; text-align: left;
}
.railItem:hover { background: var(--rail-hover); color: var(--rail-ink); }
.railItem.active { background: var(--rail-active); color: var(--rail-ink); font-weight: 600; }
.railItem.active .ico { color: var(--rail-accent); }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }

.rowSub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.gateWrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }

.gateBrand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }

.gateNote { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }

function outcomeBadge(outcome) {
  if (outcome === 'cache_hit') return '<span class="badge ok">cache hit</span>';
  if (outcome === 'pg_write') return '<span class="badge warn">pg write</span>';
  if (outcome === 'enqueue') return '<span class="badge ok">enqueue</span>';
  if (outcome === 'dequeue') return '<span class="badge" style="color:var(--muted);background:var(--bg)">dequeue</span>';
  return '<span class="badge" style="color:var(--muted);background:var(--bg)">pg read</span>';
}

// Shared table builders -- the same "RTT by outcome" and "Top SQL" views appear on both the
// Dashboard (an at-a-glance slice) and the Metrics page (the full list), so the markup lives once.
function rttOutcomeTable(rows, opts) {
  const limited = opts && opts.limit ? rows.slice(0, opts.limit) : rows;
  const body = limited.map((r) =>
    '<tr><td class="mono">' + r.protocol + '</td><td>' + outcomeBadge(r.outcome) + '</td><td class="numCell">' + r.calls.toLocaleString() + '</td><td class="numCell">' + r.avgMs.toFixed(1) + 'ms</td></tr>').join('');
  return '<div class="panel" style="padding:0"><table><thead><tr><th>Protocol</th><th>Outcome</th><th style="text-align:right">Calls</th><th style="text-align:right">Avg ms</th></tr></thead><tbody>' + body + '</tbody></table></div>';
}

function topSqlTable(rows, opts) {
  const limited = opts && opts.limit ? rows.slice(0, opts.limit) : rows;
  const maxCost = Math.max(1, ...rows.map((s) => s.totalMs || 0));
  const body = limited.map((s, i) =>
    '<tr><td class="sqlRank">' + (i + 1) + '</td><td class="mono" style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + s.sql.replace(/"/g, '&quot;') + '">' + s.sql + '</td>' +
    '<td class="numCell">' + s.calls.toLocaleString() + '</td><td class="numCell">' + s.avgMs.toFixed(1) + 'ms</td><td class="numCell">' + s.avgRttMs.toFixed(1) + 'ms</td>' +
    '<td class="numCell"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">' +
      '<span>' + (s.totalMs || 0).toLocaleString() + 'ms</span>' +
      '<span class="costBarTrack"><span class="costBarFill" style="width:' + (((s.totalMs || 0) / maxCost) * 100).toFixed(0) + '%"></span></span>' +
    '</div></td></tr>').join('');
  return '<div class="panel" style="padding:0"><table><thead><tr><th></th><th>Statement</th><th style="text-align:right">Calls</th><th style="text-align:right">Avg ms</th><th style="text-align:right">Avg RTT</th><th style="text-align:right">Total cost</th></tr></thead><tbody>' + body + '</tbody></table></div>';
}

function protocolTrafficPanel(counts) {
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...entries.map(([, c]) => c));
  const rows = entries.map(([name, count], i) =>
    '<div class="protoRow"><span class="protoDot" style="background:' + colorFor(name, i) + '"></span>' +
    '<span class="protoName">' + name + '</span>' +
    '<span class="protoBarTrack"><span class="protoBarFill" style="width:' + ((count / max) * 100).toFixed(0) + '%;background:' + colorFor(name, i) + '"></span></span>' +
    '<span class="protoCount">' + count.toLocaleString() + '</span></div>').join('');
  return '<div class="panel"><div class="sectionTitle" style="margin-bottom:2px">Wire protocol traffic</div>' +
    '<p style="font-size:12px;color:var(--muted);margin:0 0 12px">Statements handled per protocol since process start &mdash; every protocol Polywire benchmarks, not just SQL.</p>' +
    rows + '</div>';
}

function readWriteDonut(reads, writes, other) {
  const total = Math.max(1, reads + writes + other);
  const parts = [
    { label: 'Reads', value: reads, color: 'var(--accent)' },
    { label: 'Writes', value: writes, color: '#c2622f' },
    { label: 'Other', value: other, color: '#8a9790' },
  ].filter((p) => p.value > 0);
  const r = 42, circ = 2 * Math.PI * r;
  let offset = 0;
  const segs = parts.map((p) => {
    const frac = p.value / total;
    const dash = frac * circ;
    const seg = { ...p, frac, dash: dash + ' ' + (circ - dash), dashOffset: -offset };
    offset += dash;
    return seg;
  });
  const circles = segs.map((s) => '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="12" stroke-dasharray="' + s.dash + '" stroke-dashoffset="' + s.dashOffset + '" transform="rotate(-90 50 50)" stroke-linecap="butt"/>').join('');
  const legend = segs.map((s) => '<div class="legendRow"><span class="legendDot" style="background:' + s.color + '"></span>' + s.label + '<span class="legendPct">' + (s.frac * 100).toFixed(0) + '%</span></div>').join('');
  return '<div class="panel"><div class="sectionTitle">Reads vs. writes</div><p style="font-size:12px;color:var(--muted);margin:0 0 12px">Share of all statements executed</p>' +
    '<div class="donutWrap"><svg width="112" height="112" viewBox="0 0 100 100" role="img" aria-label="Reads vs writes vs other">' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="12"/>' + circles +
      '<text x="50" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">' + total.toLocaleString() + '</text>' +
      '<text x="50" y="60" text-anchor="middle" font-size="7" fill="var(--muted)">statements</text>' +
    '</svg><div class="legend">' + legend + '</div></div></div>';
}

function topologyTable(nodes) {

    '<td>' + n.lastHeartbeat + '</td><td>' + (n.status === 'up' ? '<span class="badge ok">up</span>' : '<span class="badge warn">stale</span>') + '</td></tr>').join('');
  return '<div class="panel" style="padding:0"><table><thead><tr><th>Node</th><th>Host</th><th>Zone</th><th>Version</th><th>Last heartbeat</th><th>Status</th></tr></thead><tbody>' + body + '</tbody></table></div>';
}

function firewallSummaryPanel(rules) {
  const enabled = rules.filter((r) => r.enabled);
  const allow = enabled.filter((r) => r.action === 'allow').length;
  const deny = enabled.filter((r) => r.action === 'deny').length;
  const rows = rules.map((r) =>
    '<tr' + (r.enabled ? '' : ' style="opacity:.5"') + '><td>' + r.priority + '</td>' +
    '<td>' + (r.action === 'deny' ? '<span class="badge warn">deny</span>' : '<span class="badge ok">allow</span>') + '</td>' +
    '<td class="mono">' + (r.statementType || 'any') + '</td><td class="mono">' + r.tablePattern + '</td>' +
    '<td>' + (r.enabled ? 'enabled' : 'disabled') + '</td></tr>').join('');
  return '<div class="panel"><div style="display:flex;gap:20px;margin-bottom:14px;flex-wrap:wrap">' +
    '<div><div class="statValue" style="font-size:20px">' + enabled.length + '<span style="font-size:12px;color:var(--muted);font-weight:500">/' + rules.length + ' enabled</span></div></div>' +
    '<div><span class="badge ok">' + allow + ' allow</span></div><div><span class="badge warn">' + deny + ' deny</span></div>' +
    '</div><table><thead><tr><th>Priority</th><th>Action</th><th>Statement</th><th>Table pattern</th><th>State</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

    '<span style="color:var(--muted)">' + label + '</span><span class="mono">' + (value || '<span style="color:var(--muted)">not set</span>') + '</span></div>';

function wireMetricsPage() {
  const totalCalls = Object.values(wireMetrics.protocolCounts).reduce((s, c) => s + c, 0);
  const protoCount = Object.keys(wireMetrics.protocolCounts).length;

  return (
    '<div class="metricsHero">' +
      '<div class="metricsHeroTop">' +
        '<div><div class="metricsHeroTitle">Polywire traffic</div>' +
        '<p class="metricsHeroSub">Live protocol usage, read/write throughput, and the SQL costing you the most &mdash; across every backend Polywire fronts.</p></div>' +
        '<div class="metricsHeroBadge"><span class="liveDot"></span>Live &middot; updated just now</div>' +
      '</div>' +
      '<div class="metricsHeroStats">' +
        '<div class="metricsHeroStat"><div class="metricsHeroStatLabel"><span class="ico">' + iArrowDown + '</span>Reads / sec</div><div class="metricsHeroStatValue">' + wireMetrics.readsPerSec.toFixed(1) + '</div><div class="metricsHeroStatSub">' + wireMetrics.totalReads.toLocaleString() + ' total reads</div></div>' +
        '<div class="metricsHeroStat"><div class="metricsHeroStatLabel"><span class="ico">' + iArrowUp + '</span>Writes / sec</div><div class="metricsHeroStatValue">' + wireMetrics.writesPerSec.toFixed(1) + '</div><div class="metricsHeroStatSub">' + wireMetrics.totalWrites.toLocaleString() + ' total writes</div></div>' +
        '<div class="metricsHeroStat"><div class="metricsHeroStatLabel"><span class="ico">' + iGauge + '</span>Statements total</div><div class="metricsHeroStatValue">' + totalCalls.toLocaleString() + '</div><div class="metricsHeroStatSub">since this process started</div></div>' +
        '<div class="metricsHeroStat"><div class="metricsHeroStatLabel"><span class="ico">' + iNetwork + '</span>Protocols active</div><div class="metricsHeroStatValue">' + protoCount + '</div><div class="metricsHeroStatSub">every wire protocol benchmarked</div></div>' +
        '<div class="metricsHeroStat"><div class="metricsHeroStatLabel"><span class="ico">' + iZap + '</span>Avg RTT</div><div class="metricsHeroStatValue">' + wireMetrics.avgRttMs.toFixed(1) + 'ms</div><div class="metricsHeroStatSub">' + wireMetrics.rttSamples.toLocaleString() + ' request(s) measured</div></div>' +
      '</div>' +
    '</div>' +

    '<div class="metricsGrid">' +
      protocolTrafficPanel(wireMetrics.protocolCounts) +
      readWriteDonut(wireMetrics.totalReads, wireMetrics.totalWrites, wireMetrics.totalOther) +
    '</div>' +

    sectionHead('Traffic by backend', 'backends', 'Backends') +
    '<div style="margin-bottom:20px"><div class="panel" style="padding:0"><table><thead><tr><th>Backend</th><th style="text-align:right">Calls</th><th style="text-align:right">Reads</th><th style="text-align:right">Writes</th><th style="text-align:right">Avg</th></tr></thead><tbody>' +
      '<tr><td class="mono">reporting</td><td class="numCell">1,204,880</td><td class="numCell">1,180,220</td><td class="numCell">24,660</td><td class="numCell">3.9ms</td></tr>' +
      '<tr><td class="mono">analytics</td><td class="numCell">982,004</td><td class="numCell">970,441</td><td class="numCell">11,563</td><td class="numCell">4.6ms</td></tr>' +
      '<tr><td class="mono">shard0</td><td class="numCell">1,429,237</td><td class="numCell">1,390,190</td><td class="numCell">39,047</td><td class="numCell">4.1ms</td></tr>' +
    '</tbody></table></div></div>' +

    '<div class="sectionTitle">Top 10 SQL by cost</div>' +
    '<p style="font-size:12px;color:var(--muted);margin:-4px 0 10px">Your most expensive statements, ranked by total time spent &mdash; across every protocol, not just SQL text.</p>' +
    '<div style="margin-bottom:20px">' + topSqlTable(wireMetrics.topSql) + '</div>' +

    '<div class="sectionTitle">MCP tool calls</div>' +
    '<p style="font-size:12px;color:var(--muted);margin:-4px 0 10px">Every tool call handled by the MCP server, with server-side time and error counts.</p>' +
    '<div style="margin-bottom:20px">' + mcpToolsTable(wireMetrics.mcpTools) + '</div>' +

    '<div class="sectionTitle">Round-trip by outcome</div>' +
    '<p style="font-size:12px;color:var(--muted);margin:-4px 0 10px">How long a cache hit takes vs. a real Postgres read or write, per wire protocol &mdash; the number that says whether the cache is paying for itself.</p>' +
    rttOutcomeTable(wireMetrics.rttByOutcome)
  );
}

function federationPlansPage() {
  const avgMs = Math.round(federationPlans.reduce((s, p) => s + p.elapsedMillis, 0) / federationPlans.length);
  const rows = federationPlans.map((p) =>
    '<tr class="planRow" onclick="toggleFedDetail(' + p.planId + ')" style="cursor:pointer">' +
      '<td class="mono">#' + p.planId + '</td><td class="mono" style="font-size:12px">' + p.capturedAt + '</td>' +
      '<td class="mono">' + p.backends + '</td><td class="numCell">' + p.elapsedMillis + 'ms</td><td class="numCell">' + p.rowCount.toLocaleString() + '</td>' +
      '<td>' + (p.success ? '<span class="badge ok">OK</span>' : '<span class="badge warn">failed</span>') + '</td>' +
      '<td id="fed-toggle-' + p.planId + '" style="color:var(--accent);font-size:12.5px;white-space:nowrap">+ show plan</td>' +
    '</tr>' +
    '<tr id="fed-detail-' + p.planId + '" class="hidden"><td colspan="7" style="background:var(--bg)">' +
      '<div style="padding:14px 4px">' +
        '<div class="mono" style="font-size:12.5px;margin-bottom:12px;white-space:pre-wrap">' + p.sqlText + '</div>' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px">Real Calcite plan (EXPLAIN PLAN FOR)</div>' +
        '<pre class="mono" style="font-size:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;margin:0 0 14px">' + (p.planText || '(plan text unavailable)') + '</pre>' +
        '<table><thead><tr><th>Leaf backend</th><th style="text-align:right">Elapsed</th><th style="text-align:right">Rows</th><th>Error</th></tr></thead><tbody>' +
        p.leafScans.map((l) => '<tr><td class="mono">' + l.backend + '</td><td class="numCell">' + l.elapsedMillis + 'ms</td><td class="numCell">' + l.rowCount.toLocaleString() + '</td>' +
          '<td style="color:' + (l.errorMessage ? 'var(--hard)' : 'var(--muted)') + '">' + (l.errorMessage || '—') + '</td></tr>').join('') +
        '</tbody></table>' +
      '</div></td></tr>').join('');

  return '<h1 class="pageTitle">Federation Plans</h1>' +
    '<p class="pageLede">Real captured history of every cross-shard and cross-backend JOIN Polywire has federated via Calcite &mdash; a genuine EXPLAIN PLAN FOR plan, timing, and row count per query, the same V$SQL_PLAN-style visibility a real database gives you for a query that spans several of your own backends. Refreshes every 5s.</p>' +
    '<p style="font-size:13px;margin:0 0 16px"><b>' + federationPlans.length + '</b> captured &nbsp;&middot;&nbsp; <b>' + avgMs + ' ms</b> avg</p>' +
    '<div class="panel" style="padding:0;overflow-x:auto"><table><thead><tr><th>#</th><th>When</th><th>Backends</th><th style="text-align:right">Elapsed</th><th style="text-align:right">Rows</th><th>Status</th><th>Plan</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}
window.toggleFedDetail = function (id) {
  $('#fed-detail-' + id).classList.toggle('hidden');
  const t = $('#fed-toggle-' + id);
  const open = !$('#fed-detail-' + id).classList.contains('hidden');
  t.textContent = open ? '- hide plan' : '+ show plan';
};

function aclPage() {
  const rows = aclConfig.rules.map((r) =>
    '<tr><td>' + r.priority + '</td><td class="mono">' + r.cidr + '</td>' +
    '<td>' + (r.action === 'deny' ? '<span class="badge warn">deny</span>' : '<span class="badge ok">allow</span>') + '</td>' +
    '<td style="color:var(--muted)">' + r.note + '</td></tr>').join('');
  return '<h1 class="pageTitle">ACL</h1>' +
    '<p class="pageLede">Network-level allow/deny rules, matched by source CIDR before a connection is even authenticated. Evaluated in priority order, first match wins.</p>' +
    '<div class="panel" style="margin-bottom:20px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">' +
        '<div style="font-size:13.5px;font-weight:600">PROXY protocol v2</div>' +
        '<span class="badge ' + (aclConfig.ppv2Enabled ? 'ok">enabled' : 'warn">disabled') + '</span>' +
      '</div>' +
      '<p style="font-size:12px;color:var(--muted);margin:0 0 8px">Trusts the real client IP forwarded by a load balancer instead of the LB\'s own address, for exactly these ranges:</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + aclConfig.trustedProxies.map((p) => '<span class="badge mono" style="color:var(--text);background:var(--bg);border:1px solid var(--border)">' + p + '</span>').join('') + '</div>' +
    '</div>' +
    '<div class="panel" style="padding:0"><table><thead><tr><th>Priority</th><th>CIDR</th><th>Action</th><th>Note</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function queuesPage() {
  const rows = wireQueues.map((q) =>
    '<tr><td class="mono">' + q.name + '</td><td class="numCell">' + q.visible + '</td><td class="numCell">' + q.inFlight + '</td>' +
    '<td>' + (q.fifo ? '<span class="badge ok">FIFO</span>' : '<span class="badge" style="color:var(--muted);background:var(--bg)">standard</span>') + '</td>' +

function routerRulesPage() {
  const t = (rows, cols, get) => '<div class="panel" style="padding:0;margin-bottom:16px"><table><thead><tr>' + cols.map((c) => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map((r) => '<tr>' + get(r).map((v) => '<td class="mono">' + v + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  return '<h1 class="pageTitle">Router rules</h1>' +
    '<p class="pageLede">Schema, predicate, and real-bound-value sharding rules &mdash; decoded from each protocol\'s own wire format, not just SQL text.</p>' +
    '<div class="sectionTitle">Schema rules</div>' + t(routerRules.schema, ['Schema pattern', 'Target'], (r) => [r.pattern, r.target]) +
    '<div class="sectionTitle">Predicate rules</div>' + t(routerRules.predicate, ['Table', 'Predicate', 'Target'], (r) => [r.table, r.predicate, r.target]) +
    '<div class="sectionTitle">Value-shard rules</div>' + t(routerRules.valueShard, ['Table', 'Column', 'Strategy', 'Targets'], (r) => [r.table, r.column, r.strategy, r.targets]);
}

function qosPage() {
  const classRows = qosConfig.classLimits.map((c) => '<tr><td class="mono">' + c.className + '</td><td class="numCell">' + c.ratePerSec + '/s</td><td class="numCell">' + c.burst + '</td></tr>').join('');
  return '<h1 class="pageTitle">QoS</h1>' +
    '<p class="pageLede">Admission control that stops one workload from taking down Postgres for everyone else.</p>' +
    '<div class="statGrid">' +
      statCard(iSliders, 'Global rate', qosConfig.ratePerSec + '/s', 'burst ' + qosConfig.burst) +
      statCard(iGauge, 'Max wait', qosConfig.maxWaitMs + 'ms', 'before rejecting') +
      statCard(iActivity, 'Pool wait threshold', (qosConfig.poolWaitThreshold * 100).toFixed(0) + '%', 'connection pool saturation that triggers shedding') +
    '</div>' +
    '<div class="sectionTitle">Per-class limits</div>' +
    '<div class="panel" style="padding:0"><table><thead><tr><th>Class</th><th style="text-align:right">Rate</th><th style="text-align:right">Burst</th></tr></thead><tbody>' + classRows + '</tbody></table></div>';
}

    '<p class="pageLede">' + note + '</p>' +

const wirePages = {
  dashboard: wireDashboardPage,
  metrics: wireMetricsPage,
  topology: () => '<h1 class="pageTitle">Topology</h1><p class="pageLede">Every Polywire node heartbeating against the shared config Postgres. A node is marked stale after 30s without one.</p>' + topologyTable(wireNodes),
  firewall: () => '<h1 class="pageTitle">SQL Firewall</h1><p class="pageLede">Allow/deny rules matched against incoming statements by type, table, or pattern, evaluated in priority order.</p>' + firewallSummaryPanel(firewallRules),

  oauth: () => '<h1 class="pageTitle">OAuth</h1><p class="pageLede">Issuer, audience, and claim mapping for OAuth-authenticated connections.</p>' + oauthSummaryPanel(oauthConfig),

  queues: queuesPage,
  data: dataExplorerPage,
  router: routerRulesPage,

function selectWire(page) {
  $all('#wire-shell .railItem[data-wire-page]').forEach((b) => b.classList.toggle('active', b.dataset.wirePage === page));
  $('#wire-content').innerHTML = wirePages[page]();
}
window.selectWire = selectWire;

window.toggleWireFav = function (i) { wireBackends[i].fav = !wireBackends[i].fav; wireBackends.sort((a, b) => b.fav - a.fav); selectWire('backends'); };
window.flashTested = function (btn) {
  const old = btn.innerHTML;
  btn.innerHTML = '<span class="ico" style="color:var(--accent-strong)">' + iZap + '</span>';
  btn.title = 'Connected in 6ms';
  setTimeout(() => { btn.innerHTML = old; btn.title = 'Test connection'; }, 1400);
};

function advisorDashboardPage() {
  return '<h1 class="pageTitle">Dashboard</h1>' +
    '<p class="pageLede">Overview of the databases you’ve connected and the reports you’ve analyzed.</p>' +
    '<div class="statGrid">' +
      '<div class="statCard link" onclick="selectAdvisor(\'connections\')"><div class="statLabel"><span class="ico">' + iDb + '</span>Connections</div><div class="statValue">2</div><div class="statHint">Prod Oracle 19c, Legacy MySQL</div></div>' +
      '<div class="statCard link" onclick="selectAdvisor(\'reports\')"><div class="statLabel"><span class="ico">' + iFile + '</span>Reports</div><div class="statValue">5</div><div class="statHint">4 analyzed</div></div>' +
      '<div class="statCard link" onclick="selectAdvisor(\'sizing\')"><div class="statLabel"><span class="ico">' + iGauge + '</span>Sizing runs</div><div class="statValue">2</div><div class="statHint">run from a connection</div></div>' +
    '</div>';
}

// The real Advisor app tabs Connections/Reports/Sizing on one another under a single "Advisor"
// sidebar entry (see AdvisorTabs.tsx) rather than listing them as separate nav items.
const ADVISOR_TABS = [
  { key: 'connections', label: 'Connections' },
  { key: 'reports', label: 'Reports' },
  { key: 'sizing', label: 'Sizing' },
];
function advisorTabs(active) {
  return '<div class="tabRow">' + ADVISOR_TABS.map((t) =>
    '<button type="button" class="' + (t.key === active ? 'active' : '') + '" onclick="selectAdvisor(\'' + t.key + '\')">' + t.label + '</button>').join('') + '</div>';
}

function advisorConnectionsPage() {
  const rows = advisorConnections.map((c) =>
    '<div class="rowItem">' +
      rowFavBtn(c.fav, 'toggleAdvisorFav(' + c.id + ')') +
      '<div class="rowMain"><span class="rowName">' + c.name + '</span><span class="rowSub mono">' + c.url + '</span></div>' +
      '<button type="button" class="iconBtn" title="Browse objects" onclick="alert(\'Opens the object browser for \\\'' + c.name + '\\\'.\')"><span class="ico">' + iSearch + '</span></button>' +
      '<button type="button" class="iconBtn" title="Delete connection" onclick="removeAdvisorConn(' + c.id + ')"><span class="ico">' + iTrash + '</span></button>' +
    '</div>').join('') || '<div style="padding:16px;color:var(--muted);font-size:13px">No connections yet.</div>';
  return advisorTabs('connections') + '<h1 class="pageTitle">Connections</h1>' +
    '<p class="pageLede">Databases you’re assessing for migration. Click a star to favorite.</p>' +
    '<div class="rowList" id="advisorConnList">' + rows + '</div>' +
    '<button type="button" class="btnPrimary" style="width:auto;margin-top:16px" onclick="alert(\'Opens the add-connection form.\')">Add connection</button>';
}

function advisorReportsPage() {
  const rows = advisorReports.map((r) =>
    '<tr><td>' + r.name + '</td><td class="mono">' + r.dialect + '</td><td class="mono" style="font-size:12px">' + r.filename + '</td>' +
    '<td style="color:var(--muted)">' + r.uploadedAt + '</td>' +
    '<td>' + (r.analyzedAt ? '<span class="badge ok">analyzed ' + r.analyzedAt + '</span>' : '<span class="badge" style="color:var(--muted);background:var(--bg)">not analyzed</span>') + '</td></tr>').join('');

    '<p class="pageLede">Uploaded performance reports (Oracle AWR, MySQL performance report, SQL Server DMV export) &mdash; a different kind of signal than a live connection, an LLM reads it for you.</p>' +
    '<div class="panel" style="padding:0"><table><thead><tr><th>Name</th><th>Dialect</th><th>File</th><th>Uploaded</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +

const advisorPages = {
  dashboard: advisorDashboardPage,
  connections: advisorConnectionsPage,
  reports: advisorReportsPage,
  sizing: advisorSizingPage,
  llm: () => llmConfigPage(advisorLlmConfig, 'Provider and model used to generate migration-report narratives and PL/SQL summaries &mdash; local by default, nothing leaves the machine.'),
};

const ADVISOR_TAB_KEYS = ADVISOR_TABS.map((t) => t.key);
function selectAdvisor(page) {
  $all('#advisor-shell .railItem[data-advisor-page]').forEach((b) => {
    const isTabGroup = b.dataset.advisorPage === 'connections' && ADVISOR_TAB_KEYS.includes(page);
    b.classList.toggle('active', isTabGroup || b.dataset.advisorPage === page);
  });
  $('#advisor-content').innerHTML = advisorPages[page]();
}
window.selectAdvisor = selectAdvisor;

window.toggleAdvisorFav = function (id) {
  const c = advisorConnections.find((x) => x.id === id); c.fav = !c.fav;
  advisorConnections.sort((a, b) => b.fav - a.fav);
  selectAdvisor('connections');
};
window.removeAdvisorConn = function (id) {
  const i = advisorConnections.findIndex((x) => x.id === id);
  if (i >= 0) advisorConnections.splice(i, 1);
  selectAdvisor('connections');
};

// ---------------------------------------------------------------------------------------------
// Wiring: nav clicks, gate -> shell transitions
// ---------------------------------------------------------------------------------------------
$all('[data-advisor-page]').forEach((btn) => btn.addEventListener('click', () => selectAdvisor(btn.dataset.advisorPage)));

$('[data-enter="advisor"]').addEventListener('click', () => {
  $('#advisor-gate').classList.add('hidden');
  $('#advisor-shell').classList.remove('hidden');
  selectAdvisor('dashboard');
});
$('[data-exit="advisor"]').addEventListener('click', () => {
  $('#advisor-shell').classList.add('hidden');
  $('#advisor-gate').classList.remove('hidden');
});
</script>
