<svg viewBox="0 0 1540 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="nexagres-migration architecture: eight real source connectors -- MongoDB, MySQL, SQL Server, Oracle, DynamoDB, Amazon SQS, Neo4j, and InfluxDB -- each an initial parallel snapshot plus (where the source supports it) a live change-data-capture tail, coordinated by either Coordinator (one process, local thread pool, free tier runs serial) or DistributedCoordinator (a fleet of worker processes sharing a PartitionLeaseStore, Enterprise-licensed), landing through ResilientSink's retry-then-dead-letter path into WarpGrpcSink, which writes exclusively through Warp's own gRPC driver -- never a direct JDBC backdoor -- into the target Postgres. Target-Postgres bookkeeping (CdcCheckpointStore, PartitionLeaseStore, DeadLetterStore, CutoverReadinessChecker) connects directly since it is migration infrastructure, not customer data. A CutoverReadinessChecker rolls partition completion, change-feed lag, dead-letter count, and row-level verification into a single ready/not-ready signal before a connection is pointed at Postgres for good.">
  <defs>
    <marker id="mArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a4fd6"/>
    </marker>
    <marker id="mArrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f6660"/>
    </marker>
    <marker id="mArrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b8aa0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1540" height="1080" fill="#ffffff"/>

  <!-- ===================== HEADER ===================== -->
  <text x="20" y="46" font-size="30" font-weight="800" fill="#5a3fd6">nexagres-migration</text>
  <line x1="330" y1="18" x2="330" y2="66" stroke="#d7d3e8" stroke-width="2"/>
  <text x="352" y="48" font-size="19" font-weight="600" fill="#33324a">Massively-parallel, low-downtime migration into Postgres -- through Warp's own gRPC driver, never a JDBC backdoor.</text>

  <!-- ===================== LEFT: SOURCE CONNECTORS ===================== -->
  <g>
    <rect x="20" y="96" width="360" height="38" rx="8" fill="#0f6660"/>
    <text x="38" y="121" font-size="15.5" font-weight="700" fill="#ffffff" letter-spacing="0.4">SOURCE CONNECTORS (8)</text>
    <rect x="20" y="144" width="360" height="700" rx="10" fill="#ffffff" stroke="#c9c4e0" stroke-width="1.5"/>
  </g>

  <g font-size="14.5" font-weight="700" fill="#1c1c2e">
    <!-- 1 MongoDB -->
    <rect x="20" y="156" width="360" height="86" rx="8" fill="none" stroke="#e5e2f0" stroke-width="1"/>
    <circle cx="60" cy="199" r="20" fill="#e6f6ec"/>
    <text x="60" y="205" font-size="15" text-anchor="middle" fill="#1e8a4c">🍃</text>
    <text x="92" y="185">MongoDB</text>
    <text x="92" y="203" font-size="12" font-weight="500" fill="#5b5a72">Change streams + resume tokens</text>
    <text x="92" y="219" font-size="11.5" font-weight="500" fill="#8b8aa0">real change-data capture</text>

    <!-- 2 MySQL -->
    <rect x="20" y="242" width="360" height="86" rx="8" fill="none" stroke="#e5e2f0" stroke-width="1"/>
    <circle cx="60" cy="285" r="20" fill="#e8f0fb"/>
    <text x="60" y="291" font-size="15" text-anchor="middle" fill="#2b6cb0">🐬</text>
    <text x="92" y="271">MySQL</text>
    <text x="92" y="289" font-size="12" font-weight="500" fill="#5b5a72">Binary log (ROW format)</text>
    <text x="92" y="305" font-size="11.5" font-weight="500" fill="#8b8aa0">real change-data capture</text>

    <!-- 3 SQL Server -->
    <rect x="20" y="328" width="360" height="86" rx="8" fill="none" stroke="#e5e2f0" stroke-width="1"/>
    <circle cx="60" cy="371" r="20" fill="#e8f0fb"/>
    <text x="60" y="377" font-size="14" text-anchor="middle" fill="#2b6cb0">▤</text>
    <text x="92" y="357">SQL Server</text>
    <text x="92" y="375" font-size="12" font-weight="500" fill="#5b5a72">Native CDC (cdc.fn_cdc_*)</text>
    <text x="92" y="391" font-size="11.5" font-weight="500" fill="#8b8aa0">real change-data capture</text>

    <!-- 4 Oracle -->
    <rect x="20" y="414" width="360" height="86" rx="8" fill="none" stroke="#e5e2f0" stroke-width="1"/>
    <circle cx="60" cy="457" r="20" fill="#fde8e8"/>
    <text x="60" y="463" font-size="14" text-anchor="middle" fill="#c0392b">⬭</text>
    <text x="92" y="443">Oracle</text>
    <text x="92" y="461" font-size="12" font-weight="500" fill="#5b5a72">LogMiner (SCN-checkpointed)</text>
    <text x="92" y="477" font-size="11.5" font-weight="500" fill="#8b8aa0">real change-data capture</text>

    <!-- 5 DynamoDB -->
    <rect x="20" y="500" width="360" height="86" rx="8" fill="none" stroke="#e5e2f0" stroke-width="1"/>
    <circle cx="60" cy="543" r="20" fill="#fff0e0"/>
    <text x="60" y="549" font-size="14" text-anchor="middle" fill="#c67a1e">◈</text>
    <text x="92" y="529">DynamoDB</text>
    <text x="92" y="547" font-size="12" font-weight="500" fill="#5b5a72">Streams (shard poll + reshard)</text>
    <text x="92" y="563" font-size="11.5" font-weight="500" fill="#8b8aa0">real change-data capture</text>

    <!-- 6 SQS -->
    <rect x="20" y="586" width="360" height="86" rx="8" fill="none" stroke="#e5e2f0" stroke-width="1"/>
    <circle cx="60" cy="629" r="20" fill="#fff0e0"/>
    <text x="60" y="635" font-size="14" text-anchor="middle" fill="#c67a1e">✉</text>
    <text x="92" y="615">Amazon SQS</text>
    <text x="92" y="633" font-size="12" font-weight="500" fill="#5b5a72">Drain-forward-delete (at-least-once)</text>
    <text x="92" y="649" font-size="11.5" font-weight="500" fill="#8b8aa0">no snapshot/CDC split -- a queue, not a table</text>

    <!-- 7 Neo4j -->
    <rect x="20" y="672" width="360" height="86" rx="8" fill="none" stroke="#e5e2f0" stroke-width="1"/>
    <circle cx="60" cy="715" r="20" fill="#e8f0fb"/>
    <text x="60" y="721" font-size="14" text-anchor="middle" fill="#2b6cb0">◎</text>
    <text x="92" y="701">Neo4j</text>
    <text x="92" y="719" font-size="12" font-weight="500" fill="#5b5a72">Snapshot only (no CDC exists)</text>
    <text x="92" y="735" font-size="11.5" font-weight="500" fill="#8b8aa0">server-assigned id-mapping table</text>

    <!-- 8 InfluxDB -->
    <rect x="20" y="758" width="360" height="86" rx="8" fill="none" stroke="#e5e2f0" stroke-width="1"/>
    <circle cx="60" cy="801" r="20" fill="#e6f6ec"/>
    <text x="60" y="807" font-size="14" text-anchor="middle" fill="#1e8a4c">◷</text>
    <text x="92" y="787">InfluxDB</text>
    <text x="92" y="805" font-size="12" font-weight="500" fill="#5b5a72">Timestamp-cursor live tail</text>
    <text x="92" y="821" font-size="11.5" font-weight="500" fill="#8b8aa0">real change-data capture</text>
  </g>
  <text x="200" y="864" font-size="12" text-anchor="middle" fill="#8b8aa0">every target schema matched byte-for-byte to Warp's own wire protocol</text>

  <!-- connector arrows: sources -> pipeline -->
  <path d="M380,199 C 405,199 405,240 430,240" fill="none" stroke="#8b8aa0" stroke-width="1.5" marker-end="url(#mArrowDash)"/>
  <path d="M380,285 C 405,285 405,240 430,240" fill="none" stroke="#8b8aa0" stroke-width="1.5" marker-end="url(#mArrowDash)"/>
  <path d="M380,371 C 405,371 405,240 430,240" fill="none" stroke="#8b8aa0" stroke-width="1.5" marker-end="url(#mArrowDash)"/>
  <path d="M380,457 C 405,457 405,240 430,240" fill="none" stroke="#8b8aa0" stroke-width="1.5" marker-end="url(#mArrowDash)"/>
  <path d="M380,543 C 405,543 405,240 430,240" fill="none" stroke="#8b8aa0" stroke-width="1.5" marker-end="url(#mArrowDash)"/>
  <path d="M380,629 C 405,629 405,240 430,240" fill="none" stroke="#8b8aa0" stroke-width="1.5" marker-end="url(#mArrowDash)"/>
  <path d="M380,715 C 405,715 405,240 430,240" fill="none" stroke="#8b8aa0" stroke-width="1.5" marker-end="url(#mArrowDash)"/>
  <path d="M380,801 C 405,801 405,240 430,240" fill="none" stroke="#8b8aa0" stroke-width="1.5" marker-end="url(#mArrowDash)"/>

  <!-- ===================== MIDDLE: PIPELINE ===================== -->
  <g>
    <rect x="430" y="96" width="600" height="38" rx="8" fill="#5a3fd6"/>
    <text x="448" y="121" font-size="15.5" font-weight="700" fill="#ffffff" letter-spacing="0.4">MIGRATION PIPELINE (per source)</text>
  </g>

  <!-- Stage 1: partition snapshot -->
  <rect x="430" y="150" width="600" height="76" rx="10" fill="#f4f2fb" stroke="#c9c4e0" stroke-width="1.5"/>
  <text x="452" y="176" font-size="14.5" font-weight="700" fill="#1c1c2e">1. listPartitions() / readPartition</text>
  <text x="452" y="196" font-size="12" font-weight="500" fill="#5b5a72">Initial snapshot, split into N partitions read in parallel</text>
  <text x="452" y="213" font-size="11.5" font-weight="500" fill="#8b8aa0">idempotent upserts -- a retried partition never double-counts</text>
  <line x1="730" y1="226" x2="730" y2="248" stroke="#6a4fd6" stroke-width="2" marker-end="url(#mArrow)"/>

  <!-- Stage 2: coordination (split free/paid) -->
  <rect x="430" y="248" width="290" height="150" rx="10" fill="#f4f2fb" stroke="#c9c4e0" stroke-width="1.5"/>
  <text x="452" y="272" font-size="14" font-weight="700" fill="#1c1c2e">Coordinator</text>
  <text x="452" y="290" font-size="11.5" font-weight="600" fill="#0f6660">FREE -- every install</text>
  <text x="452" y="310" font-size="12" font-weight="500" fill="#5b5a72">One process, local thread pool.</text>
  <text x="452" y="326" font-size="12" font-weight="500" fill="#5b5a72">No license: serial, one partition</text>
  <text x="452" y="342" font-size="12" font-weight="500" fill="#5b5a72">at a time -- correct, just slower.</text>
  <text x="452" y="368" font-size="11" font-weight="500" fill="#8b8aa0">parallelism&gt;1 needs Enterprise</text>
  <text x="452" y="384" font-size="11" font-weight="500" fill="#8b8aa0">(MigrationLicensing, fails closed)</text>

  <rect x="740" y="248" width="290" height="150" rx="10" fill="#faf3e3" stroke="#e3c88a" stroke-width="1.5"/>
  <text x="762" y="272" font-size="14" font-weight="700" fill="#1c1c2e">DistributedCoordinator</text>
  <text x="762" y="290" font-size="11.5" font-weight="700" fill="#a15c07">ENTERPRISE -- licensed</text>
  <text x="762" y="310" font-size="12" font-weight="500" fill="#5b5a72">A FLEET of worker processes</text>
  <text x="762" y="326" font-size="12" font-weight="500" fill="#5b5a72">sharing one PartitionLeaseStore --</text>
  <text x="762" y="342" font-size="12" font-weight="500" fill="#5b5a72">real, multi-machine parallelism.</text>
  <text x="762" y="368" font-size="11" font-weight="500" fill="#8b8aa0">refuses to construct at all</text>
  <text x="762" y="384" font-size="11" font-weight="500" fill="#8b8aa0">without a valid license key</text>

  <text x="730" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="#8b8aa0">choose one, per deployment</text>

  <line x1="730" y1="398" x2="730" y2="420" stroke="#6a4fd6" stroke-width="2" marker-end="url(#mArrow)"/>

  <!-- Stage 3: change feed -->
  <rect x="430" y="420" width="600" height="70" rx="10" fill="#f4f2fb" stroke="#c9c4e0" stroke-width="1.5"/>
  <text x="452" y="445" font-size="14.5" font-weight="700" fill="#1c1c2e">3. streamChanges() -- live tail</text>
  <text x="452" y="464" font-size="12" font-weight="500" fill="#5b5a72">Exactly one leader owns the feed; resume point captured before any partition starts</text>
  <text x="452" y="480" font-size="11.5" font-weight="500" fill="#8b8aa0">SQS/Neo4j opt out -- no true CDC concept for either source</text>
  <line x1="730" y1="490" x2="730" y2="512" stroke="#6a4fd6" stroke-width="2" marker-end="url(#mArrow)"/>

  <!-- Stage 4: ResilientSink -->
  <rect x="430" y="512" width="600" height="70" rx="10" fill="#f4f2fb" stroke="#c9c4e0" stroke-width="1.5"/>
  <text x="452" y="537" font-size="14.5" font-weight="700" fill="#1c1c2e">4. ResilientSink</text>
  <text x="452" y="556" font-size="12" font-weight="500" fill="#5b5a72">Retries a failed write; a batch that still fails falls back to per-event retry</text>
  <text x="452" y="572" font-size="11.5" font-weight="500" fill="#8b8aa0">exhausted retries -&gt; DeadLetterStore, never a stalled partition</text>
  <line x1="730" y1="582" x2="730" y2="604" stroke="#6a4fd6" stroke-width="2" marker-end="url(#mArrow)"/>

  <!-- Stage 5: WarpGrpcSink -->
  <rect x="430" y="604" width="600" height="76" rx="10" fill="#efe9fb" stroke="#8b6fe8" stroke-width="2"/>
  <text x="452" y="631" font-size="15" font-weight="800" fill="#5a3fd6">5. WarpGrpcSink</text>
  <text x="452" y="651" font-size="12" font-weight="600" fill="#33324a">QueryService.Execute -- Warp's own native gRPC driver</text>
  <text x="452" y="667" font-size="11.5" font-weight="500" fill="#8b8aa0">NEVER a direct JDBC connection to target data -- same firewall/QoS/cache path as any client</text>

  <!-- bookkeeping side box -->
  <rect x="430" y="704" width="600" height="150" rx="10" fill="#ffffff" stroke="#c9c4e0" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="452" y="728" font-size="13.5" font-weight="700" fill="#1c1c2e">Target-Postgres bookkeeping <tspan font-weight="500" fill="#8b8aa0" font-size="11.5">(direct JDBC -- infrastructure, not customer data)</tspan></text>
  <g font-size="12" font-weight="600" fill="#1c1c2e">
    <rect x="452" y="740" width="272" height="50" rx="8" fill="#f4f2fb"/>
    <text x="466" y="760" font-weight="700">CdcCheckpointStore</text>
    <text x="466" y="777" font-size="11" font-weight="500" fill="#5b5a72">resume tokens + event-lag timestamp</text>

    <rect x="736" y="740" width="272" height="50" rx="8" fill="#f4f2fb"/>
    <text x="750" y="760" font-weight="700">PartitionLeaseStore</text>
    <text x="750" y="777" font-size="11" font-weight="500" fill="#5b5a72">atomic claim/done per partition + leader</text>

    <rect x="452" y="798" width="272" height="46" rx="8" fill="#f4f2fb"/>
    <text x="466" y="818" font-weight="700">DeadLetterStore</text>
    <text x="466" y="834" font-size="11" font-weight="500" fill="#5b5a72">permanently-failed events, recorded not lost</text>

    <rect x="736" y="798" width="272" height="46" rx="8" fill="#f4f2fb"/>
    <text x="750" y="818" font-weight="700">CutoverReadinessChecker</text>
    <text x="750" y="834" font-size="11" font-weight="500" fill="#5b5a72">partitions + lag + dead-letters + verify -&gt; 1 signal</text>
  </g>
  <line x1="623" y1="680" x2="623" y2="704" stroke="#8b8aa0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="906" y1="890" x2="906" y2="854" stroke="#8b8aa0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mArrowDash)"/>

  <!-- arrow into Warp -->
  <line x1="1030" y1="642" x2="1080" y2="642" stroke="#6a4fd6" stroke-width="2.5" marker-end="url(#mArrow)"/>

  <!-- ===================== RIGHT: WARP + POSTGRES ===================== -->
  <g>
    <rect x="1090" y="96" width="430" height="38" rx="8" fill="#0f6660"/>
    <text x="1108" y="121" font-size="15.5" font-weight="700" fill="#ffffff" letter-spacing="0.4">WARP (real, running instance)</text>
    <rect x="1090" y="144" width="430" height="560" rx="10" fill="#ffffff" stroke="#c9c4e0" stroke-width="1.5"/>
  </g>

  <g font-size="13" font-weight="700" fill="#1c1c2e">
    <rect x="1108" y="160" width="394" height="52" rx="8" fill="#f4f2fb"/>
    <text x="1124" y="182">gRPC frontend</text>
    <text x="1124" y="200" font-size="11.5" font-weight="500" fill="#5b5a72">QueryService.Execute -- authenticated identity, audited like any client</text>

    <rect x="1108" y="220" width="394" height="52" rx="8" fill="#f4f2fb"/>
    <text x="1124" y="242">FirewallStage</text>
    <text x="1124" y="260" font-size="11.5" font-weight="500" fill="#5b5a72">SQL firewall, ACL, RLS identity -- same policy as every protocol</text>

    <rect x="1108" y="280" width="394" height="52" rx="8" fill="#f4f2fb"/>
    <text x="1124" y="302">RouterStage</text>
    <text x="1124" y="320" font-size="11.5" font-weight="500" fill="#5b5a72">Shard-aware -- writes reach the right backend, sharded or not</text>

    <rect x="1108" y="340" width="394" height="52" rx="8" fill="#f4f2fb"/>
    <text x="1124" y="362">QosControlStage</text>
    <text x="1124" y="380" font-size="11.5" font-weight="500" fill="#5b5a72">Admission control -- migration traffic can't starve live queries</text>

    <rect x="1108" y="400" width="394" height="52" rx="8" fill="#f4f2fb"/>
    <text x="1124" y="422">DialectTranslationStage</text>
    <text x="1124" y="440" font-size="11.5" font-weight="500" fill="#5b5a72">Cached rewrite -- warms up as the same INSERT text repeats</text>
  </g>

  <line x1="1305" y1="452" x2="1305" y2="474" stroke="#0f6660" stroke-width="2" marker-end="url(#mArrowTeal)"/>

  <text x="1305" y="500" font-size="12" font-weight="700" text-anchor="middle" fill="#8b8aa0">…RollupStage, CacheStage, StatsCollectorStage…</text>
  <line x1="1305" y1="510" x2="1305" y2="532" stroke="#0f6660" stroke-width="2" marker-end="url(#mArrowTeal)"/>

  <!-- postgres cylinder -->
  <g>
    <ellipse cx="1305" cy="580" rx="130" ry="22" fill="#e8f0fb" stroke="#336791" stroke-width="2"/>
    <path d="M1175,580 L1175,650 A130,22 0 0 0 1435,650 L1435,580" fill="#e8f0fb" stroke="#336791" stroke-width="2"/>
    <ellipse cx="1305" cy="650" rx="130" ry="22" fill="none" stroke="#336791" stroke-width="2"/>
    <text x="1305" y="588" font-size="17" text-anchor="middle" fill="#336791">🐘</text>
    <text x="1305" y="618" font-size="14" font-weight="700" text-anchor="middle" fill="#1c1c2e">Target Postgres</text>
    <text x="1305" y="636" font-size="11.5" text-anchor="middle" fill="#5b5a72">schema matched to the wire protocol's own store</text>
  </g>

  <line x1="1305" y1="672" x2="1305" y2="694" stroke="#0f6660" stroke-width="2" marker-end="url(#mArrowTeal)"/>
  <rect x="1108" y="694" width="394" height="52" rx="8" fill="#eef8f2" stroke="#8fcaa6" stroke-width="1.5"/>
  <text x="1124" y="716" font-size="13" font-weight="700" fill="#1c1c2e">RowChecksum verification</text>
  <text x="1124" y="734" font-size="11.5" font-weight="500" fill="#5b5a72">Order-independent XOR checksum, source vs. target -- proves it, not assumed</text>

  <!-- ===================== FOOTER ===================== -->
  <line x1="20" y1="880" x2="1520" y2="880" stroke="#e5e2f0" stroke-width="1"/>
  <text x="20" y="912" font-size="14.5" font-weight="700" fill="#1c1c2e">Cutover, in one signal</text>
  <text x="20" y="934" font-size="12.5" font-weight="500" fill="#5b5a72">CutoverReadinessChecker rolls partition completion + change-feed lag + dead-letter count + row-level verification into a single</text>
  <text x="20" y="952" font-size="12.5" font-weight="500" fill="#5b5a72">READY / NOT READY -- fail-closed: zero partitions recorded reads as "migration never ran," never as "nothing to check."</text>

  <text x="20" y="998" font-size="12" fill="#8b8aa0">nexagres-migration v1 -- eight real source connectors, one gRPC path into Postgres, free-tier serial or Enterprise-tier fleet-parallel.</text>
</svg>
