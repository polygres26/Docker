</style><rect width="1760" height="1080" fill="var(--paper)"/><text x="40" y="58" class="h1" text-anchor="start">Warp</text><text x="128" y="58" class="sub" text-anchor="start">one Postgres estate, every database&#x27;s protocol</text><text x="40" y="86" class="note" text-anchor="start">Applications keep their drivers and change only the host and port. Every request, whatever the protocol, runs the same pipeline and lands in Postgres.</text><text x="40" y="128" class="eyebrow" text-anchor="start">CLIENTS</text><text x="350" y="128" class="eyebrow" text-anchor="start">FRONTENDS, one per protocol</text><text x="1110" y="128" class="eyebrow" text-anchor="start">SHARED PIPELINE</text><text x="1360" y="128" class="eyebrow" text-anchor="start">BACKEND SETS AND BACKENDS</text><rect x="40" y="150" width="250" height="62" rx="6" class="box"/><text x="56" y="187" class="lbl" text-anchor="start">JDBC / ODBC drivers</text><rect x="40" y="238" width="250" height="62" rx="6" class="box"/><text x="56" y="275" class="lbl" text-anchor="start">AWS, Azure and Google SDKs</text><rect x="40" y="326" width="250" height="62" rx="6" class="box"/><text x="56" y="363" class="lbl" text-anchor="start">mongosh, redis-cli, cypher-shell</text><rect x="40" y="414" width="250" height="62" rx="6" class="box"/><text x="56" y="451" class="lbl" text-anchor="start">Applications, ORMs, BI tools</text><rect x="40" y="502" width="250" height="62" rx="6" class="box"/><text x="56" y="539" class="lbl" text-anchor="start">AI agents</text><rect x="350" y="150" width="700" height="94" rx="8" fill="var(--ember_s)" stroke="var(--ember)" stroke-width="1"/><text x="366" y="176" class="grp ember" text-anchor="start">RELATIONAL SQL</text><rect x="366" y="190" width="162" height="46" rx="5" class="card"/><text x="378" y="210" class="mono" text-anchor="start">pgwire</text><text x="518" y="210" class="port" text-anchor="end">15432</text><text x="378" y="227" class="small" text-anchor="start">PostgreSQL</text><rect x="540" y="190" width="162" height="46" rx="5" class="card"/><text x="552" y="210" class="mono" text-anchor="start">mywire</text><text x="692" y="210" class="port" text-anchor="end">13306</text><text x="552" y="227" class="small" text-anchor="start">MySQL</text><rect x="714" y="190" width="162" height="46" rx="5" class="card"/><text x="726" y="210" class="mono" text-anchor="start">mssqlwire</text><text x="866" y="210" class="port" text-anchor="end">14333</text><text x="726" y="227" class="small" text-anchor="start">SQL Server</text><rect x="888" y="190" width="162" height="46" rx="5" class="card"/><text x="900" y="210" class="mono" text-anchor="start">orawire</text><text x="1040" y="210" class="port" text-anchor="end">11521</text><text x="900" y="227" class="small" text-anchor="start">Oracle</text><rect x="350" y="258" width="700" height="202" rx="8" fill="var(--green_s)" stroke="var(--green)" stroke-width="1"/><text x="366" y="284" class="grp green" text-anchor="start">DOCUMENTS, KEYS, SEARCH, GRAPH, SERIES</text><rect x="366" y="298" width="162" height="46" rx="5" class="card"/><text x="378" y="318" class="mono" text-anchor="start">mongowire</text><text x="518" y="318" class="port" text-anchor="end">27017</text><text x="378" y="335" class="small" text-anchor="start">MongoDB</text><rect x="540" y="298" width="162" height="46" rx="5" class="card"/><text x="552" y="318" class="mono" text-anchor="start">dynamowire</text><text x="692" y="318" class="port" text-anchor="end">18000</text><text x="552" y="335" class="small" text-anchor="start">DynamoDB</text><rect x="714" y="298" width="162" height="46" rx="5" class="card"/><text x="726" y="318" class="mono" text-anchor="start">rediswire</text><text x="866" y="318" class="port" text-anchor="end">16379</text><text x="726" y="335" class="small" text-anchor="start">Redis</text><rect x="888" y="298" width="162" height="46" rx="5" class="card"/><text x="900" y="318" class="mono" text-anchor="start">oswire</text><text x="1040" y="318" class="port" text-anchor="end">9200</text><text x="900" y="335" class="small" text-anchor="start">OpenSearch</text><rect x="366" y="352" width="162" height="46" rx="5" class="card"/><text x="378" y="372" class="mono" text-anchor="start">boltwire</text><text x="518" y="372" class="port" text-anchor="end">7687</text><text x="378" y="389" class="small" text-anchor="start">Neo4j</text><rect x="540" y="352" width="162" height="46" rx="5" class="card"/><text x="552" y="372" class="mono" text-anchor="start">influxwire</text><text x="692" y="372" class="port" text-anchor="end">8086</text><text x="552" y="389" class="small" text-anchor="start">InfluxDB</text><rect x="714" y="352" width="162" height="46" rx="5" class="card"/><text x="726" y="372" class="mono" text-anchor="start">aztable</text><text x="866" y="372" class="port" text-anchor="end">azure</text><text x="726" y="389" class="small" text-anchor="start">Azure Table</text><rect x="888" y="352" width="162" height="46" rx="5" class="card"/><text x="900" y="372" class="mono" text-anchor="start">firestorewire</text><text x="1040" y="372" class="port" text-anchor="end">8080</text><text x="900" y="389" class="small" text-anchor="start">Firestore</text><rect x="366" y="406" width="162" height="46" rx="5" class="card"/><text x="378" y="426" class="mono" text-anchor="start">datastorewire</text><text x="518" y="426" class="port" text-anchor="end">8081</text><text x="378" y="443" class="small" text-anchor="start">Datastore</text><rect x="540" y="406" width="162" height="46" rx="5" class="card"/><text x="552" y="426" class="mono" text-anchor="start">bigtablewire</text><text x="692" y="426" class="port" text-anchor="end">8088</text><text x="552" y="443" class="small" text-anchor="start">Bigtable</text><rect x="714" y="406" width="162" height="46" rx="5" class="card"/><text x="726" y="426" class="mono" text-anchor="start">cqlwire</text><text x="866" y="426" class="port" text-anchor="end">19042</text><text x="726" y="443" class="sma