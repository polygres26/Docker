ss="pill"/><text x="1467.9" y="584.04" class="pilltxt" text-anchor="middle">MySQL</text><rect x="1501.4" y="567.04" width="88.0" height="26" rx="13" class="pill"/><text x="1545.4" y="584.04" class="pilltxt" text-anchor="middle">SQL Server</text><rect x="1597.4" y="567.04" width="51.0" height="26" rx="13" class="pill"/><text x="1622.9" y="584.04" class="pilltxt" text-anchor="middle">Neo4j</text><rect x="1360" y="666.52" width="360" height="117.47999999999999" rx="8" fill="var(--slate_s)" stroke="var(--slate)" stroke-width="1"/><text x="1376" y="692.52" class="grp slate" text-anchor="start">CONNECTORS (federated reads)</text><rect x="1376" y="706.52" width="80.60000000000001" height="26" rx="13" class="pill"/><text x="1416.3" y="723.52" class="pilltxt" text-anchor="middle">Snowflake</text><rect x="1464.6" y="706.52" width="73.2" height="26" rx="13" class="pill"/><text x="1501.1999999999998" y="723.52" class="pilltxt" text-anchor="middle">BigQuery</text><rect x="1545.8" y="706.52" width="88.0" height="26" rx="13" class="pill"/><text x="1589.8" y="723.52" class="pilltxt" text-anchor="middle">ClickHouse</text><rect x="1641.8" y="706.52" width="51.0" height="26" rx="13" class="pill"/><text x="1667.3" y="723.52" class="pilltxt" text-anchor="middle">Kafka</text><rect x="1376" y="740.52" width="80.60000000000001" height="26" rx="13" class="pill"/><text x="1416.3" y="757.52" class="pilltxt" text-anchor="middle">Cassandra</text><rect x="1464.6" y="740.52" width="28.8" height="26" rx="13" class="pill"/><text x="1479.0" y="757.52" class="pilltxt" text-anchor="middle">S3</text><line x1="1304" y1="427.0" x2="1358" y2="427.0" class="edge" marker-end="url(#ar)"/><line x1="1304" y1="587.0" x2="1358" y2="587.0" class="edge" marker-end="url(#ar)"/><text x="40" y="818" class="eyebrow" text-anchor="start">AROUND THE GATEWAY</text><rect x="40.0" y="832" width="546.6666666666666" height="84" rx="8" class="box"/><text x="60.0" y="864" class="h3" text-anchor="start">Ferry</text><text x="60.0" y="892" class="small" text-anchor="start">migrates data and schema into Postgres</text><rect x="606.6666666666666" y="832" width="546.6666666666666" height="84" rx="8" class="box"/><text x="626.6666666666666" y="864" class="h3" text-anchor="start">Shim</text><text x="626.6666666666666" y="892" class="small" text-anchor="start">compatibility functions and views</text><rect x="1173.3333333333333" y="832" width="546.6666666666666" height="84" rx="8" class="box"/><text x="1193.3333333333333" y="864" class="h3" text-anchor="start">Control plane</text><text x="1193.3333333333333" y="892" class="small" text-anchor="start">backend sets, users, licences</text><text x="40" y="942" class="cap" text-anchor="start">Generated by docker/assets/gen_architecture.py. Ports shown are the frontend defaults inside the container; azure and gRPC/REST entries are configured per deployment.</text></svg>