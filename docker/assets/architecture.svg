<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 956" role="img" aria-label="Warp architecture: clients connect over native protocols to frontends, which share one pipeline and store data in Postgres backend sets"><style>
:root{--paper:#f4f3ef;--surface:#ffffff;--ink:#20211f;--muted:#666962;--line:#dcded7;--ember:#e4512d;--ember_s:#fff0e8;--green:#19725a;--green_s:#e5f3ed;--amber:#9a6508;--amber_s:#fbf1dc;--slate:#4a4d45;--slate_s:#ecece7;--ink_s:#e6e6e0;--rail:#242722;--rail_text:#f4f2eb;--rail_muted:#a7aaa1}
@media (prefers-color-scheme: dark){:root{--paper:#171816;--surface:#242722;--ink:#f4f2eb;--muted:#a7aaa1;--line:#3b3e37;--ember:#f0704f;--ember_s:#3a2219;--green:#3fbf98;--green_s:#17302a;--amber:#e0a93a;--amber_s:#38290f;--slate:#b9bcb2;--slate_s:#2d302a;--ink_s:#2d302a;--rail:#0f100f;--rail_text:#f4f2eb;--rail_muted:#a7aaa1}}
text{font-family:Inter, 'Helvetica Neue', Arial, sans-serif;fill:var(--ink)}
.h1{font-size:34px;font-weight:700;letter-spacing:-0.02em}
