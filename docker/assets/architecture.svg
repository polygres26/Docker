t x="552" y="659" class="small" text-anchor="start">Azure Blob</text><rect x="714" y="622" width="162" height="46" rx="5" class="card"/><text x="726" y="642" class="mono" text-anchor="start">gcswire</text><text x="866" y="642" class="port" text-anchor="end">4443</text><text x="726" y="659" class="small" text-anchor="start">Cloud Storage</text><rect x="888" y="622" width="162" height="46" rx="5" class="card"/><text x="900" y="642" class="mono" text-anchor="start">awswire</text><text x="1040" y="642" class="port" text-anchor="end">4566</text><text x="900" y="659" class="small" text-anchor="start">Secrets, SSM, KMS, STS</text><rect x="350" y="690" width="700" height="94" rx="8" fill="var(--ink_s)" stroke="var(--ink)" stroke-width="1"/><text x="366" y="716" class="grp ink" text-anchor="start">WARP NATIVE</text><rect x="366" y="730" width="162" height="46" rx="5" class="card"/><text x="378" y="750" class="mono" text-anchor="start">gRPC</text><text x="518" y="750" class="port" text-anchor="end">7070</text><text x="378" y="767" class="small" text-anchor="start">typed clients</text><rect x="540" y="730" width="162" height="46" rx="5" class="card"/><text x="552" y="750" class="mono" text-anchor="start">MCP</text><text x="692" y="750" class="port" text-anchor="end">18010</text><text x="552" y="767" class="small" text-anchor="start">AI agents</text><rect x="714" y="730" width="162" height="46" rx="5" class="card"/><text x="726" y="750" class="mono" text-anchor="start">Admin UI</text><text x="866" y="750" class="port" text-anchor="end">19090</text><text x="726" y="767" class="small" text-anchor="start">operators</text><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><path d="M290 181.0 C 320 181.0, 320 467.0, 348 467.0" class="edge"/><path d="M290 269.0 C 320 269.0, 320 467.0, 348 467.0" class="edge"/><path d="M290 357.0 C 320 357.0, 320 467.0, 