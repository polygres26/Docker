# Serves the built SPA and proxies /api to the real backend -- the production-shaped equivalent
# of advisor/web/vite.config.ts's dev-server proxy (see that file's own comment: "In production
# the SPA is served by that same process [...], not yet ported here" -- until that's built, this
# nginx config is the real answer for serving both pieces together).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom client-side routing -- any path nginx doesn't have a real file for falls
    # back to index.html, letting the SPA's own router take over instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Service name from docker-compose.yml, not localhost -- these are two separate containers.
        proxy_pass http://backend:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
